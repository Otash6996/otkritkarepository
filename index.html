<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Наш дневник памяти</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --wine: #2b1220;
    --wine-deep: #1c0a14;
    --blush: #e7a9a4;
    --gold: #cf9f5c;
    --cream: #f4e9df;
    --cream-dim: #cbb9ae;
    --line: rgba(244,233,223,0.14);
  }

  *{ box-sizing: border-box; }

  html{ scroll-behavior: smooth; }

  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 15% -5%, rgba(207,159,92,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 90% 10%, rgba(231,169,164,0.08), transparent 55%),
      linear-gradient(180deg, var(--wine-deep), var(--wine) 18%, var(--wine) 85%, var(--wine-deep));
    color: var(--cream);
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* drifting soft particles */
  .petal{
    position: fixed;
    top: -5%;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(231,169,164,0.9), rgba(231,169,164,0));
    filter: blur(0.5px);
    opacity: 0.55;
    animation: fall linear infinite;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes fall{
    to{ transform: translateY(115vh) translateX(20px) rotate(180deg); }
  }

  header{
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 8.5rem 1.5rem 5rem;
  }

  .eyebrow{
    font-family: 'Jost', sans-serif;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    font-size: 0.72rem;
    color: var(--gold);
    margin-bottom: 1.4rem;
    opacity: 0.9;
  }

  h1{
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(2.4rem, 6vw, 4.2rem);
    margin: 0 0 1.1rem;
    line-height: 1.15;
    color: var(--cream);
    text-shadow: 0 0 40px rgba(207,159,92,0.15);
  }

  .sub{
    max-width: 480px;
    margin: 0 auto;
    color: var(--cream-dim);
    font-size: 1.02rem;
    line-height: 1.75;
  }

  .sub em{ color: var(--blush); font-style: italic; }

  .ribbon{
    width: 1px;
    height: 70px;
    background: linear-gradient(var(--gold), transparent);
    margin: 2.4rem auto 0;
    position: relative;
  }
  .ribbon::after{
    content: '♥';
    position: absolute;
    bottom: -14px;
    left: 50%;
    transform: translateX(-50%);
    color: var(--gold);
    font-size: 0.9rem;
  }

  main{
    position: relative;
    z-index: 1;
    max-width: 760px;
    margin: 0 auto;
    padding: 0 1.5rem 6rem;
  }

  .chapter{
    margin-bottom: 6.5rem;
    opacity: 0;
    transform: translateY(28px);
    transition: opacity 0.9s ease, transform 0.9s ease;
  }
  .chapter.visible{
    opacity: 1;
    transform: translateY(0);
  }

  .chapter-head{
    display: flex;
    align-items: baseline;
    gap: 1.1rem;
    margin-bottom: 1.5rem;
  }

  .chapter-num{
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 1rem;
    color: var(--gold);
    letter-spacing: 0.05em;
    white-space: nowrap;
  }

  .chapter-head .rule{
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .chapter-title{
    font-family: 'Playfair Display', serif;
    font-weight: 500;
    font-size: clamp(1.3rem, 3vw, 1.7rem);
    margin: 0 0 1.2rem;
    color: var(--cream);
  }

  .frame{
    position: relative;
    border-radius: 4px;
    padding: 10px;
    background: linear-gradient(155deg, rgba(244,233,223,0.06), rgba(244,233,223,0.015));
    border: 1px solid var(--line);
    box-shadow: 0 25px 60px -25px rgba(0,0,0,0.65);
  }

  .frame::before{
    content: '';
    position: absolute;
    inset: 5px;
    border: 1px solid rgba(207,159,92,0.25);
    border-radius: 2px;
    pointer-events: none;
  }

  video{
    display: block;
    width: 100%;
    border-radius: 2px;
    background: #000;
    outline: none;
  }

  .caption{
    margin-top: 1rem;
    font-size: 0.92rem;
    color: var(--cream-dim);
    line-height: 1.6;
    font-style: italic;
    padding-left: 0.2rem;
  }

  footer{
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 3rem 1.5rem 5rem;
  }

  footer .mark{
    font-family: 'Playfair Display', serif;
    font-style: italic;
    color: var(--blush);
    font-size: 1.15rem;
    letter-spacing: 0.02em;
  }

  footer .small{
    margin-top: 0.6rem;
    font-size: 0.78rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--cream-dim);
    opacity: 0.6;
  }

  @media (max-width: 560px){
    header{ padding: 6rem 1.2rem 3.5rem; }
    .chapter{ margin-bottom: 4.5rem; }
  }

  @media (prefers-reduced-motion: reduce){
    .petal{ animation: none; display: none; }
    .chapter{ transition: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>

<div id="petals"></div>

<header>
  <div class="eyebrow">для тебя</div>
  <div class="ribbon"></div>
</header>

<main>

  <section class="chapter">
    <div class="chapter-head">
      <span class="chapter-num">Глава первая</span>
      <span class="rule"></span>
    </div>
    <div class="frame">
      <video controls preload="metadata" playsinline controlsList="nodownload">
        <source src="videos/video1.mp4" type="video/mp4">
      </video>
    </div>
  </section>

  <section class="chapter">
    <div class="chapter-head">
      <span class="chapter-num">Глава вторая</span>
      <span class="rule"></span>
    </div>
    <div class="frame">
      <video controls preload="metadata" playsinline controlsList="nodownload">
        <source src="videos/video2.mp4" type="video/mp4">
      </video>
    </div>
  </section>

  <section class="chapter">
    <div class="chapter-head">
      <span class="chapter-num">Глава третья</span>
      <span class="rule"></span>
    </div>
    <div class="frame">
      <video controls preload="metadata" playsinline controlsList="nodownload">
        <source src="videos/video3.mp4" type="video/mp4">
      </video>
    </div>
  </section>

</main>

<footer>
  <div class="mark">с любовью</div>
  <div class="small">сохрани эту страницу вместе с папкой videos</div>
</footer>

<script>
  // gentle drifting petals
  const container = document.getElementById('petals');
  const count = window.innerWidth < 600 ? 10 : 18;
  for(let i=0;i<count;i++){
    const p = document.createElement('div');
    p.className = 'petal';
    const size = 3 + Math.random()*5;
    p.style.width = size+'px';
    p.style.height = size+'px';
    p.style.left = Math.random()*100+'vw';
    p.style.animationDuration = (14 + Math.random()*14)+'s';
    p.style.animationDelay = (Math.random()*-20)+'s';
    container.appendChild(p);
  }

  // reveal chapters on scroll
  const chapters = document.querySelectorAll('.chapter');
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        e.target.classList.add('visible');
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.15 });
  chapters.forEach(c=>io.observe(c));

  // pause other videos when one plays, so it feels like one continuous story
  const videos = document.querySelectorAll('video');
  videos.forEach(v=>{
    v.addEventListener('play', ()=>{
      videos.forEach(other=>{
        if(other!==v) other.pause();
      });
    });
  });
</script>

</body>
</html>
