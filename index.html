<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>♥</title>
<style>
  :root{
    --wine: #2b1220;
    --wine-deep: #1c0a14;
    --blush: #e7a9a4;
    --gold: #cf9f5c;
    --cream: #f4e9df;
    --line: rgba(244,233,223,0.14);
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 15% -5%, rgba(207,159,92,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 90% 10%, rgba(231,169,164,0.08), transparent 55%),
      linear-gradient(180deg, var(--wine-deep), var(--wine) 18%, var(--wine) 85%, var(--wine-deep));
    min-height: 100vh;
    overflow-x: hidden;
  }

  .petal{
    position: fixed;
    top: -5%;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(231,169,164,0.9), rgba(231,169,164,0));
    filter: blur(0.5px);
    opacity: 0.5;
    animation: fall linear infinite;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes fall{
    to{ transform: translateY(115vh) translateX(20px) rotate(180deg); }
  }

  .top-space{ height: 6.5rem; }

  main{
    position: relative;
    z-index: 1;
    max-width: 760px;
    margin: 0 auto;
    padding: 0 1.4rem 6rem;
  }

  .divider{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    margin: 0 auto 3.5rem;
    width: 60%;
  }
  .divider .line{
    flex:1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--line), transparent);
  }
  .divider .dot{
    color: var(--gold);
    font-size: 0.7rem;
    opacity: 0.85;
  }

  .chapter{
    margin-bottom: 4.5rem;
    opacity: 0;
    transform: translateY(28px);
    transition: opacity 0.9s ease, transform 0.9s ease;
  }
  .chapter.visible{
    opacity: 1;
    transform: translateY(0);
  }
  .chapter:first-of-type .divider{ display: none; }

  .frame{
    position: relative;
    border-radius: 4px;
    padding: 10px;
    background: linear-gradient(155deg, rgba(244,233,223,0.06), rgba(244,233,223,0.015));
    border: 1px solid var(--line);
    box-shadow: 0 25px 60px -25px rgba(0,0,0,0.65);
  }

  .frame::before{
    content: '';
    position: absolute;
    inset: 5px;
    border: 1px solid rgba(207,159,92,0.25);
    border-radius: 2px;
    pointer-events: none;
    z-index: 2;
  }

  video{
    display: block;
    width: 100%;
    border-radius: 2px;
    background: #000;
    outline: none;
  }

  .bottom-space{ height: 3rem; }
  .final-heart{
    text-align: center;
    color: var(--blush);
    opacity: 0.7;
    font-size: 1rem;
    letter-spacing: 0.3em;
  }

  @media (prefers-reduced-motion: reduce){
    .petal{ animation: none; display: none; }
    .chapter{ transition: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>

<div id="petals"></div>
<div class="top-space"></div>

<main>

  <section class="chapter">
    <div class="divider"><span class="line"></span><span class="dot">♥</span><span class="line"></span></div>
    <div class="frame">
      <video controls preload="metadata" playsinline controlsList="nodownload" poster="videos/video1.jpg">
        <source src="videos/video1.mp4" type="video/mp4">
      </video>
    </div>
  </section>

  <section class="chapter">
    <div class="divider"><span class="line"></span><span class="dot">♥</span><span class="line"></span></div>
    <div class="frame">
      <video controls preload="metadata" playsinline controlsList="nodownload" poster="videos/video2.jpg">
        <source src="videos/video2.mp4" type="video/mp4">
      </video>
    </div>
  </section>

  <section class="chapter">
    <div class="divider"><span class="line"></span><span class="dot">♥</span><span class="line"></span></div>
    <div class="frame">
      <video controls preload="metadata" playsinline controlsList="nodownload" poster="videos/video3.jpg">
        <source src="videos/video3.mp4" type="video/mp4">
      </video>
    </div>
  </section>

  <div class="bottom-space"></div>
  <div class="final-heart">♥</div>

</main>

<script>
  const container = document.getElementById('petals');
  const count = window.innerWidth < 600 ? 10 : 18;
  for(let i=0;i<count;i++){
    const p = document.createElement('div');
    p.className = 'petal';
    const size = 3 + Math.random()*5;
    p.style.width = size+'px';
    p.style.height = size+'px';
    p.style.left = Math.random()*100+'vw';
    p.style.animationDuration = (14 + Math.random()*14)+'s';
    p.style.animationDelay = (Math.random()*-20)+'s';
    container.appendChild(p);
  }

  const chapters = document.querySelectorAll('.chapter');
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        e.target.classList.add('visible');
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.15 });
  chapters.forEach(c=>io.observe(c));

  const videos = document.querySelectorAll('video');
  videos.forEach(v=>{
    v.addEventListener('play', ()=>{
      videos.forEach(other=>{
        if(other!==v) other.pause();
      });
    });
  });
</script>

</body>
</html>
